name: Не ставится / ошибка при установке
description: Установка не прошла или остановилась с ошибкой
title: "[установка] "
body:
  - type: markdown
    attributes:
      value: |
        Эту страницу видят все. **Не выкладывайте** пароли, токен бота, файлы WireGuard (.conf) и ключи
        из них, MAC-адреса и адреса своих сайтов и устройств.
  - type: input
    id: router
    attributes:
      label: Модель роутера
      placeholder: "например: Keenetic Giga KN-1012 / Xiaomi AX3000T"
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Прошивка и её версия
      placeholder: "например: KeeneticOS 4.2.3 / OpenWrt 24.10.0"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия switchback
      description: Видна внизу окна программы.
      placeholder: "0.7.5"
  - type: dropdown
    id: where
    attributes:
      label: Где упало
      options:
        - В программе switchback.exe
        - Вручную, командами на роутере
    validations:
      required: true
  - type: textarea
    id: did
    attributes:
      label: Что делали
      description: По шагам — какие кнопки нажимали или какие команды вводили.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Последние строки вывода
      description: |
        Из окна программы или из SSH — 20–30 последних строк. Можно приложить снимок экрана.
        Перед вставкой уберите пароли и ключи.
      render: text
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Проверка
      options:
        - label: В тексте и вложениях нет паролей, токена бота, ключей WireGuard, MAC-адресов и моих сайтов
          required: true
